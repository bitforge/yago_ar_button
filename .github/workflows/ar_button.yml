name: 🤳 🪴 AR Button

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: 💿 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build
        run: yarn build:dev

      - name: 🌐 Install browser
        run: yarn playwright install --with-deps chromium

      - name: 🚨 Smoke test
        run: yarn test:smoke
